[package]
name = "opentask_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.8"
futures-util = "0.3"
regex = "1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
reqwest = { version = "0.13.4", features = ["json"] }
vt100 = "0.16.2"
base64 = "0.23.1"

[profile.release]
opt-level = 3
lto = true
